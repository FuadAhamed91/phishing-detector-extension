<svg xmlns="http://www.w3.org/2000/svg" width="780" height="150" viewBox="0 0 780 150" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#fff">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#15803d"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
    <linearGradient id="u" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/></linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".25"/></filter>
  </defs>
  <g filter="url(#s)">
    <rect x="10" y="20" width="175" height="58" rx="12" fill="url(#g)" stroke="rgba(255,255,255,.28)"/>
    <rect x="200" y="20" width="185" height="110" rx="12" fill="url(#a)" stroke="rgba(255,255,255,.28)"/>
    <rect x="400" y="20" width="185" height="110" rx="12" fill="url(#r)" stroke="rgba(255,255,255,.28)"/>
    <rect x="600" y="20" width="170" height="92" rx="12" fill="url(#u)" stroke="rgba(255,255,255,.28)"/>
  </g>
  <!-- safe -->
  <circle cx="30" cy="38" r="9" fill="rgba(255,255,255,.22)"/><text x="30" y="42" text-anchor="middle" font-weight="700">✓</text>
  <text x="45" y="42" font-weight="600" font-size="13">Looks safe</text>
  <rect x="140" y="30" width="36" height="16" rx="8" fill="rgba(0,0,0,.22)"/><text x="158" y="42" text-anchor="middle" font-weight="700">100%</text>
  <text x="24" y="64" font-family="Consolas, Menlo, monospace" font-weight="600">→ github.com</text>
  <!-- caution -->
  <circle cx="220" cy="38" r="9" fill="rgba(255,255,255,.22)"/><text x="220" y="42" text-anchor="middle" font-weight="700">!</text>
  <text x="235" y="42" font-weight="600" font-size="13">Use caution</text>
  <rect x="340" y="30" width="36" height="16" rx="8" fill="rgba(0,0,0,.22)"/><text x="358" y="42" text-anchor="middle" font-weight="700">60%</text>
  <text x="214" y="64" font-family="Consolas, Menlo, monospace" font-weight="600">→ evil.xyz</text>
  <line x1="212" y1="76" x2="373" y2="76" stroke="rgba(255,255,255,.22)"/>
  <text x="214" y="94" font-size="11">• .xyz domains are frequently abused</text>
  <text x="214" y="112" font-size="11">• Redirected through www.google.com</text>
  <!-- warning -->
  <circle cx="420" cy="38" r="9" fill="rgba(255,255,255,.22)"/><text x="420" y="42" text-anchor="middle" font-weight="700">⚠</text>
  <text x="435" y="42" font-weight="600" font-size="13">Suspicious link</text>
  <rect x="540" y="30" width="36" height="16" rx="8" fill="rgba(0,0,0,.22)"/><text x="558" y="42" text-anchor="middle" font-weight="700">20%</text>
  <text x="414" y="64" font-family="Consolas, Menlo, monospace" font-weight="600">→ account-services.net</text>
  <line x1="412" y1="76" x2="573" y2="76" stroke="rgba(255,255,255,.22)"/>
  <text x="414" y="94" font-size="11">• Uses the PayPal name, not a PayPal site</text>
  <text x="414" y="112" font-size="11">• "account" in the domain name</text>
  <!-- unknown -->
  <circle cx="620" cy="38" r="9" fill="rgba(255,255,255,.22)"/><text x="620" y="42" text-anchor="middle" font-weight="700">?</text>
  <text x="635" y="42" font-weight="600" font-size="13">Shortened link</text>
  <text x="614" y="64" font-family="Consolas, Menlo, monospace" font-weight="600">→ bit.ly</text>
  <line x1="612" y1="76" x2="758" y2="76" stroke="rgba(255,255,255,.22)"/>
  <text x="614" y="94" font-size="11">• The real destination is hidden</text>
</svg>
